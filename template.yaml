AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Pehra - WBGT work-rest plans for India's outdoor workers.
  Serverless, ap-south-1, AWS Free Tier friendly. Deploy: make layer && sam build && sam deploy

Parameters:
  ParamPrefix:
    Type: String
    Default: /invisible-heat
    Description: SSM prefix holding telegram-token, webhook-secret and data-key (SecureString)
  # Amazon Nova by default (no Marketplace subscription needed). Claude via India profiles works too:
  # in.anthropic.claude-haiku-4-5-20251001-v1:0 / in.anthropic.claude-sonnet-5
  BedrockModelFast:
    Type: String
    Default: apac.amazon.nova-lite-v1:0
  BedrockModelQa:
    Type: String
    Default: apac.amazon.nova-pro-v1:0
  AgentEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  RecordRetentionDays:
    Type: Number
    Default: 90
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email for the budget and forecast-late alarms

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Handler: app.handler
    Timeout: 30
    MemorySize: 512
    Layers: [!Ref CoreLayer]
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        HEAT_BUCKET: !Ref HeatBucket
        MEDIA_BUCKET: !Ref MediaBucket
        RECORDS_BUCKET: !Ref RecordsBucket
        OUT_QUEUE_URL: !Ref OutQueue
        PLAN_QUEUE_URL: !Ref PlanQueue
        PARAM_PREFIX: !Ref ParamPrefix
        BEDROCK_MODEL_FAST: !Ref BedrockModelFast
        BEDROCK_MODEL_QA: !Ref BedrockModelQa
        AGENT_ENABLED: !Ref AgentEnabled

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  # ---------------------------------------------------------------- storage
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      SSESpecification: { SSEEnabled: true }

  HeatBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      LifecycleConfiguration:
        Rules: [{ Id: expire-old-runs, Status: Enabled, Prefix: heat/, ExpirationInDays: 30 }]

  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      LifecycleConfiguration:
        Rules:
          - { Id: voice, Status: Enabled, Prefix: voice/, ExpirationInDays: 30 }
          - { Id: incoming-audio, Status: Enabled, Prefix: incoming/, ExpirationInDays: 1 }
          - { Id: transcripts, Status: Enabled, Prefix: transcripts/, ExpirationInDays: 1 }
          - { Id: reports, Status: Enabled, Prefix: reports/, ExpirationInDays: 30 }
          - { Id: call-audio, Status: Enabled, Prefix: calls/, ExpirationInDays: 1 }

  # Object Lock can only be enabled when a bucket is created.
  RecordsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention: { Mode: GOVERNANCE, Days: !Ref RecordRetentionDays }
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }

  # ---------------------------------------------------------------- queues
  PlanDLQ:
    Type: AWS::SQS::Queue
    Properties: { MessageRetentionPeriod: 1209600, SqsManagedSseEnabled: true }
  PlanQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy: { deadLetterTargetArn: !GetAtt PlanDLQ.Arn, maxReceiveCount: 3 }
  OutDLQ:
    Type: AWS::SQS::Queue
    Properties: { MessageRetentionPeriod: 1209600, SqsManagedSseEnabled: true }
  OutQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy: { deadLetterTargetArn: !GetAtt OutDLQ.Arn, maxReceiveCount: 5 }

  # ---------------------------------------------------------------- shared code
  CoreLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: heatcore, ihcommon, agent, Cedar policies, web templates and Python deps (arm64)
      ContentUri: layers/core/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Delete

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings: { ThrottlingBurstLimit: 50, ThrottlingRateLimit: 20 }

  # ---------------------------------------------------------------- forecast
  IngestForecastFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Fetch forecast, compute WBGT once per city, store on S3 (compute once, look up many)
      CodeUri: functions/ingest_forecast/
      Timeout: 600
      Policies:
        - S3CrudPolicy: { BucketName: !Ref HeatBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
      Events:
        # 05:30, 09:30 and 17:30 IST: before the 10:30 re-check and the 19:00 plan
        Ingest:
          Type: ScheduleV2
          Properties: { ScheduleExpression: "cron(0 0,4,12 * * ? *)" }

  # ---------------------------------------------------------------- daily plan flow
  PlanStepFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Steps of the daily plan state machine (build, send, wait token, record)
      CodeUri: functions/plan_step/
      Timeout: 60
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref HeatBucket }
        - S3CrudPolicy: { BucketName: !Ref MediaBucket }
        - SQSSendMessagePolicy: { QueueName: !GetAtt OutQueue.QueueName }
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/in.anthropic.*"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/apac.amazon.nova-*"
                - "arn:aws:bedrock:*::foundation-model/anthropic.*"
                - "arn:aws:bedrock:*::foundation-model/amazon.nova-*"

  DailyPlanStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: statemachine/daily_plan.asl.json
      DefinitionSubstitutions:
        PlanStepArn: !GetAtt PlanStepFunction.Arn
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref PlanStepFunction }

  DailyFanoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: 19:00 IST - one plan message per registered site onto the plan queue
      CodeUri: functions/daily_fanout/
      Timeout: 60
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
        - SQSSendMessagePolicy: { QueueName: !GetAtt PlanQueue.QueueName }
      Events:
        Evening:
          Type: ScheduleV2
          Properties: { ScheduleExpression: "cron(30 13 * * ? *)" }

  PlanWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: SQS consumer that starts one idempotent plan execution per site and date
      CodeUri: functions/plan_worker/
      Environment:
        Variables: { PLAN_SFN_ARN: !Ref DailyPlanStateMachine }
      Policies:
        - StepFunctionsExecutionPolicy: { StateMachineName: !GetAtt DailyPlanStateMachine.Name }
      Events:
        Plans:
          Type: SQS
          Properties:
            Queue: !GetAtt PlanQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]

  SenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Drains outgoing messages to Telegram, WhatsApp or a Twilio voice call, under rate limits
      CodeUri: functions/sender/
      Timeout: 120
      Policies:
        - S3CrudPolicy: { BucketName: !Ref MediaBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPrefix}/*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition: { StringEquals: { "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com" } }
      Events:
        Outgoing:
          Type: SQS
          Properties:
            Queue: !GetAtt OutQueue.Arn
            BatchSize: 10
            ScalingConfig: { MaximumConcurrency: 2 }
            FunctionResponseTypes: [ReportBatchItemFailures]

  # ---------------------------------------------------------------- supervisor bot
  TelegramWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Telegram webhook - commands, Approve/Override (Cedar), crew roster
      CodeUri: functions/telegram_webhook/
      Timeout: 25
      MemorySize: 1024
      Environment:
        Variables:
          PLAN_SFN_ARN: !Ref DailyPlanStateMachine
          ASSISTANT_FN: !Ref AssistantFunction
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref HeatBucket }
        - StepFunctionsExecutionPolicy: { StateMachineName: !GetAtt DailyPlanStateMachine.Name }
        - LambdaInvokePolicy: { FunctionName: !Ref AssistantFunction }
        - SQSSendMessagePolicy: { QueueName: !GetAtt OutQueue.QueueName }
        - Statement:
            - Effect: Allow
              Action: [states:SendTaskSuccess, states:SendTaskFailure]
              Resource: !Ref DailyPlanStateMachine
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPrefix}/*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition: { StringEquals: { "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com" } }
      Events:
        Telegram:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /telegram }

  WhatsAppWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: WhatsApp Cloud API webhook - same supervisor bot as Telegram (signature-checked)
      CodeUri: functions/whatsapp_webhook/
      Timeout: 25
      MemorySize: 1024
      Environment:
        Variables:
          PLAN_SFN_ARN: !Ref DailyPlanStateMachine
          ASSISTANT_FN: !Ref AssistantFunction
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref HeatBucket }
        - StepFunctionsExecutionPolicy: { StateMachineName: !GetAtt DailyPlanStateMachine.Name }
        - LambdaInvokePolicy: { FunctionName: !Ref AssistantFunction }
        - SQSSendMessagePolicy: { QueueName: !GetAtt OutQueue.QueueName }
        - Statement:
            - Effect: Allow
              Action: [states:SendTaskSuccess, states:SendTaskFailure]
              Resource: !Ref DailyPlanStateMachine
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPrefix}/*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition: { StringEquals: { "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com" } }
      Events:
        Verify: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /whatsapp } }
        Messages: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /whatsapp } }

  AssistantFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Async Strands agent answers and Transcribe voice rosters
      CodeUri: functions/assistant/
      Timeout: 120
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref HeatBucket }
        - S3CrudPolicy: { BucketName: !Ref MediaBucket }
        - SQSSendMessagePolicy: { QueueName: !GetAtt OutQueue.QueueName }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/in.anthropic.*"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/apac.amazon.nova-*"
                - "arn:aws:bedrock:*::foundation-model/anthropic.*"
                - "arn:aws:bedrock:*::foundation-model/amazon.nova-*"
            - Effect: Allow
              Action: [transcribe:StartTranscriptionJob, transcribe:GetTranscriptionJob]
              Resource: "*"
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPrefix}/*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition: { StringEquals: { "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com" } }

  PersonalFanoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: 07:00 IST - personal/family heat message for every person; opt-in family calls on high days
      CodeUri: functions/personal_fanout/
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref HeatBucket }
        - SQSSendMessagePolicy: { QueueName: !GetAtt OutQueue.QueueName }
      Events:
        Morning:
          Type: ScheduleV2
          Properties: { ScheduleExpression: "cron(30 1 * * ? *)" }

  RecheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: 10:30 and 13:30 IST - re-plan from the newest forecast; alert only if stricter
      CodeUri: functions/recheck/
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref HeatBucket }
        - SQSSendMessagePolicy: { QueueName: !GetAtt OutQueue.QueueName }
      Events:
        Morning:
          Type: ScheduleV2
          Properties: { ScheduleExpression: "cron(0 5 * * ? *)" }
        Afternoon:
          Type: ScheduleV2
          Properties: { ScheduleExpression: "cron(0 8 * * ? *)" }

  # ---------------------------------------------------------------- workers and records
  PublicWebFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Worker QR page, picture poster, check-in API, audit and model-card pages
      CodeUri: functions/public_web/
      Timeout: 20
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref HeatBucket }
        - SQSSendMessagePolicy: { QueueName: !GetAtt OutQueue.QueueName }
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPrefix}/*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition: { StringEquals: { "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com" } }
      Events:
        WorkerPage: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/s/{token}" } }
        Poster: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/p/{token}" } }
        Checkin: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/checkin } }
        Audit: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /audit } }
        ModelCard: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /model-card } }
        Sensor: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/sensor } }
        DevicePage: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/device/{token}" } }
        Home: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: / } }
        Images: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/img/{name}" } }
        SiteStyle: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /site.css } }
        WebAssets: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/assets/{name}" } }

  NightlyRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: 23:30 IST - hash-chained daily record per site into the Object Lock bucket
      CodeUri: functions/nightly_record/
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${RecordsBucket.Arn}/records/*"
      Events:
        Night:
          Type: ScheduleV2
          Properties: { ScheduleExpression: "cron(0 18 * * ? *)" }

  ReportPdfFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Monthly compliance PDF from locked records (Cedar-checked)
      CodeUri: functions/report_pdf/
      Timeout: 60
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref RecordsBucket }
        - S3CrudPolicy: { BucketName: !Ref MediaBucket }

  # ---------------------------------------------------------------- Pehra Site Box (AWS IoT Core)
  IotBoxFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Site Box - IoT Core telemetry in, commands out (MQTT); HTTPS fallback; 3D twin state
      CodeUri: functions/iot_box/
      Timeout: 20
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref HeatBucket }
        - SQSSendMessagePolicy: { QueueName: !GetAtt OutQueue.QueueName }
        - Statement:
            - Effect: Allow
              Action: iot:DescribeEndpoint
              Resource: "*"
            - Effect: Allow
              Action: iot:Publish
              Resource: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/pehra/box/*/cmd"
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPrefix}/*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition: { StringEquals: { "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com" } }
      Events:
        BoxPost: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/box } }
        BoxState: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/api/box/{token}/state" } }
        Twin: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/twin/{token}" } }

  SiteBoxIotPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-sitebox"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:client/${!iot:Connection.Thing.ThingName}"
          - Effect: Allow
            Action: iot:Publish
            Resource: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/pehra/box/${!iot:Connection.Thing.ThingName}/telemetry"
          - Effect: Allow
            Action: iot:Subscribe
            Resource: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/pehra/box/${!iot:Connection.Thing.ThingName}/cmd"
          - Effect: Allow
            Action: iot:Receive
            Resource: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/pehra/box/${!iot:Connection.Thing.ThingName}/cmd"

  SiteBoxTelemetryRule:
    Type: AWS::IoT::TopicRule
    Properties:
      TopicRulePayload:
        Description: Site Box telemetry to the Pehra Lambda (box_id = thing name from the topic)
        Sql: "SELECT *, topic(3) AS box_id FROM 'pehra/box/+/telemetry'"
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Actions:
          - Lambda: { FunctionArn: !GetAtt IotBoxFunction.Arn }

  SiteBoxRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IotBoxFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt SiteBoxTelemetryRule.Arn

  # ---------------------------------------------------------------- observability
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      Subscription: [{ Protocol: email, Endpoint: !Ref AlertEmail }]

  ForecastLateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: No forecast ingested for 12 hours - plans will use an older (stale) forecast
      Namespace: InvisibleHeat
      MetricName: ForecastIngested
      Statistic: Sum
      Period: 43200
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  OutDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Telegram messages are failing repeatedly (outgoing DLQ not empty)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt OutDLQ.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}"
      DashboardBody: !Sub |
        {"widgets":[
          {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Plans","region":"${AWS::Region}","stat":"Sum","period":3600,
            "metrics":[["InvisibleHeat","PlanSent"],["InvisibleHeat","PlanApproved"],["InvisibleHeat","PlanNoResponse"]]}},
          {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Trust: overrides, fallbacks, number check","region":"${AWS::Region}","stat":"Sum","period":3600,
            "metrics":[["InvisibleHeat","PlanOverridden","direction","looser"],["InvisibleHeat","PlanOverridden","direction","stricter"],["InvisibleHeat","TemplateFallback","kind","plan"],
                       ["InvisibleHeat","NumberCheckFailed","kind","answer"],["InvisibleHeat","NumberCheckFallback","kind","answer"],["InvisibleHeat","AuthzDeny","action","LoosenPlan"]]}},
          {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Forecast runs ingested","region":"${AWS::Region}","stat":"Sum","period":3600,
            "metrics":[["InvisibleHeat","ForecastIngested"],["InvisibleHeat","ForecastIngestFailed"]]}},
          {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Workers","region":"${AWS::Region}","stat":"Sum","period":3600,
            "metrics":[["InvisibleHeat","BreakLogged","type","break_start"],["InvisibleHeat","SymptomReported"],["InvisibleHeat","RecheckAlert","simulated","False"]]}}
        ]}

  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 5, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  ApiUrl:
    Description: Base URL (worker pages /s/{token}, posters /p/{token}, /audit, /model-card)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TelegramWebhookUrl:
    Description: Pass to scripts/set_webhook.py
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/telegram"
  WhatsAppWebhookUrl:
    Description: Callback URL for the Meta app's WhatsApp webhook
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/whatsapp"
  StateMachineArn:
    Value: !Ref DailyPlanStateMachine
  RecordsBucketName:
    Value: !Ref RecordsBucket
  HeatBucketName:
    Value: !Ref HeatBucket
  IngestFunctionName:
    Value: !Ref IngestForecastFunction
  PersonalFanoutFunctionName:
    Value: !Ref PersonalFanoutFunction
  SiteBoxIotPolicyName:
    Value: !Ref SiteBoxIotPolicy
  RecheckFunctionName:
    Value: !Ref RecheckFunction
  NightlyRecordFunctionName:
