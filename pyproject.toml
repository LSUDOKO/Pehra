[project]
name = "invisible-heat"
version = "0.1.0"
description = "Heat-safety work-rest plans for India's outdoor workers, based on WBGT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "thermofeel>=2.3.0",
    "numpy>=1.26",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heatcore"]
