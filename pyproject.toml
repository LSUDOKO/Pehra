[project]
name = "invisible-heat"
version = "0.1.0"
description = "Heat-safety work-rest plans for India's outdoor workers, based on WBGT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "thermofeel>=2.3.0",
    "numpy>=1.26",
    "requests>=2.32",
    "cedarpy>=4.12.1",
    "strands-agents>=1.59.0",
    "boto3>=1.43.110",
    "segno>=1.6.6",
    "fpdf2>=2.8.9",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "moto[dynamodb,s3,sqs,ssm,stepfunctions]>=5.2.3",
    "pyarrow>=26.0.0",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heatcore", "ihcommon", "agent"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"ihcommon/texts.py" = ["E501"]
"scripts/build_pages.py" = ["E501"]
"scripts/seed_sample_month.py" = ["E501"]
"scripts/smoke_deployed.py" = ["E501"]
"scripts/smoke_v2.py" = ["E501"]
"agent/prompts.py" = ["E501"]
"ihcommon/whatsapp.py" = ["E501"]
"functions/whatsapp_webhook/app.py" = ["E501"]
"heatcore/templates_people.py" = ["E501"]
"ihcommon/bot_people.py" = ["E501"]
"tests/*.py" = ["E501"]
"ihcommon/devices.py" = ["E501"]
"functions/public_web/app.py" = ["E501"]
"scripts/run_audit.py" = ["E501"]
"heatcore/audit.py" = ["E501"]
