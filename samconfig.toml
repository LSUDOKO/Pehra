version = 0.1

[default.global.parameters]
stack_name = "invisible-heat"
region = "ap-south-1"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
s3_prefix = "invisible-heat"
parameter_overrides = "BedrockModelFast=apac.amazon.nova-pro-v1:0 BedrockModelQa=apac.amazon.nova-pro-v1:0"
region = "ap-south-1"
